<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="36" fill="#0c0c0e"/>
  <!-- Cricket ball -->
  <circle cx="96" cy="88" r="46" fill="#dc2626"/>
  <!-- Seam lines -->
